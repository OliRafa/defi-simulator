name: Sync Upstream

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
    steps:
      # When upstream conflicts with the fork's own commits the API answers 409
      # and this run fails, leaving master and the image where they were.
      - id: merge
        run: |
          merge_type=$(gh api -X POST "repos/${REPOSITORY}/merge-upstream" \
            -f branch=master --jq .merge_type)
          echo "Upstream merge: ${merge_type}" >> "$GITHUB_STEP_SUMMARY"
          echo "type=${merge_type}" >> "$GITHUB_OUTPUT"

      - if: steps.merge.outputs.type != 'none'
        run: gh workflow run continuous_integration.yml --repo "$REPOSITORY" --ref master
